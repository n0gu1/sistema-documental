services:
  - type: web
    name: sistema-documental
    runtime: python
    buildCommand: npm ci --prefix frontend --include=dev && npm run build --prefix frontend && pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: sistema-documental.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: sistema-documental-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://sistema-documental.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://sistema-documental.onrender.com
      - key: STORAGE_BACKEND
        value: s3
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_REGION_NAME
        value: us-east-005
      - key: AWS_S3_ENDPOINT_URL
        value: https://s3.us-east-005.backblazeb2.com
      - key: AWS_LOCATION
        value: documentos
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
      - key: NOTIFICATIONS_EMAIL_ENABLED
        value: "false"
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "true"
      - key: EMAIL_USE_SSL
        value: "false"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
    plan: free
    region: oregon

  - type: cron
    name: sistema-documental-respaldos
    runtime: python
    schedule: "0 2 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py generar_respaldos_programados
    envVars:
      - key: SECRET_KEY
        fromService:
          type: web
          name: sistema-documental
          envVarKey: SECRET_KEY
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: sistema-documental.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: sistema-documental-db
          property: connectionString
      - key: STORAGE_BACKEND
        value: s3
      - key: AWS_STORAGE_BUCKET_NAME
        fromService:
          type: web
          name: sistema-documental
          envVarKey: AWS_STORAGE_BUCKET_NAME
      - key: AWS_ACCESS_KEY_ID
        fromService:
          type: web
          name: sistema-documental
          envVarKey: AWS_ACCESS_KEY_ID
      - key: AWS_SECRET_ACCESS_KEY
        fromService:
          type: web
          name: sistema-documental
          envVarKey: AWS_SECRET_ACCESS_KEY
      - key: AWS_S3_REGION_NAME
        value: us-east-005
      - key: AWS_S3_ENDPOINT_URL
        value: https://s3.us-east-005.backblazeb2.com
      - key: AWS_LOCATION
        value: documentos
      - key: BACKUP_ENCRYPTION_KEY
        fromService:
          type: web
          name: sistema-documental
          envVarKey: BACKUP_ENCRYPTION_KEY
    plan: starter
    region: oregon

  - type: cron
    name: sistema-documental-reportes
    runtime: python
    schedule: "0 3 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py generar_reportes_programados
    envVars:
      - key: SECRET_KEY
        fromService:
          type: web
          name: sistema-documental
          envVarKey: SECRET_KEY
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: sistema-documental.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: sistema-documental-db
          property: connectionString
      - key: STORAGE_BACKEND
        value: s3
      - key: AWS_STORAGE_BUCKET_NAME
        fromService:
          type: web
          name: sistema-documental
          envVarKey: AWS_STORAGE_BUCKET_NAME
      - key: AWS_ACCESS_KEY_ID
        fromService:
          type: web
          name: sistema-documental
          envVarKey: AWS_ACCESS_KEY_ID
      - key: AWS_SECRET_ACCESS_KEY
        fromService:
          type: web
          name: sistema-documental
          envVarKey: AWS_SECRET_ACCESS_KEY
      - key: AWS_S3_REGION_NAME
        value: us-east-005
      - key: AWS_S3_ENDPOINT_URL
        value: https://s3.us-east-005.backblazeb2.com
      - key: AWS_LOCATION
        value: documentos
    plan: starter
    region: oregon

databases:
  - name: sistema-documental-db
    plan: free
    databaseName: sistema_documental
